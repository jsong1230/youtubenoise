    languages: ["ko"]
    modules:
      - type: "clock_reading"
        weight: 1.0
    num_problems: 15
    problem_settings:
      clock_reading:
        time_type: "hour_half"  # hour, hour_half, hour_quarter, exact
        display_seconds: 8
        countdown_seconds: 12
    color_scheme:
      background: [240, 245, 245]  # 연한 청록
      text: [40, 40, 40]
      highlight: [100, 180, 180]
      correct: [80, 160, 80]
