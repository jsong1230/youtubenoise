# 시니어용 종합 두뇌훈련 프리셋 설정
# 치매 예방을 위한 다양한 인지 기능 훈련 모듈

# 기본 설정 (모든 프리셋에 공통 적용)
defaults:
  video_width: 1920
  video_height: 1080
  fps: 30
  bgm_path: null  # BGM 파일 경로 (선택사항)
  enable_narration: false  # TTS 내레이션 사용 여부
  enable_subtitles: true  # 자막 사용 여부
  intro_duration: 5  # 인트로 길이 (초)
  outro_duration: 5  # 아웃트로 길이 (초)
  problem_intro_duration: 3  # 문제 소개 화면 길이 (초)
  answer_display_duration: 5  # 정답 화면 길이 (초)
  
  # 기본 색상 스킴
  default_color_scheme:
    background: [245, 243, 240]  # 중립적인 베이지
    text: [40, 40, 40]
    highlight: [150, 120, 180]
    correct: [80, 160, 80]
    countdown: [200, 80, 60]
  
  # 기본 폰트 및 스타일
  default_font_size: 84
  default_image_style: "warm, clear, simple illustration, senior-friendly, high contrast"
  default_transition_seconds: 2

presets:
  # ============================================
  # 단일 모듈 프리셋 (한글)
  # ============================================
  
  number_memory_senior:
    name: "숫자 기억 훈련"
    description: "시니어용 숫자 기억력 훈련 (쉬운 난이도, 3~4자리)"
    difficulty: "easy"
    languages: ["ko"]
    modules:
      - type: "number_memory"
        weight: 1.0
    num_problems: 20
    problem_settings:
      number_memory:
        digit_count: 4
        display_seconds: 5
        countdown_seconds: 10
    color_scheme:
      background: [245, 240, 235]  # 따뜻한 아이보리
      text: [40, 40, 40]
      highlight: [100, 150, 200]  # 부드러운 파란색
      correct: [80, 160, 80]
      countdown: [200, 80, 60]
    font_size: 96
    transition_seconds: 2
    
  pattern_sequence_senior:
    name: "패턴 순서 맞추기"
    description: "시니어용 패턴 인식 훈련 (색상, 도형 순서)"
    difficulty: "easy"
    languages: ["ko"]
    modules:
      - type: "pattern_sequence"
        weight: 1.0
    num_problems: 15
    problem_settings:
      pattern_sequence:
        sequence_length: 4
        pattern_type: "letters"  # numbers, letters, colors, symbols (shapes만 제외)
        display_seconds: 8
        countdown_seconds: 12
    color_scheme:
      background: [245, 245, 250]  # 연한 라벤더
      text: [40, 40, 40]
      highlight: [180, 120, 200]
      correct: [80, 160, 80]
      countdown: [200, 80, 60]
    font_size: 84
    transition_seconds: 2
    
  word_association_senior:
    name: "단어 연상 게임"
    description: "시니어용 언어 능력 훈련 (한글 단어 연상)"
    difficulty: "easy"
    languages: ["ko"]
    modules:
      - type: "word_association"
        weight: 1.0
    num_problems: 20
    problem_settings:
      word_association:
        word_category: "일상"  # 일상, 자연, 음식, 계절
        num_choices: 3
        display_seconds: 10
        countdown_seconds: 15
    color_scheme:
      background: [250, 245, 235]  # 따뜻한 크림
      text: [40, 40, 40]
      highlight: [220, 150, 100]
      correct: [80, 160, 80]
      countdown: [200, 80, 60]
