# Sleep Story LLM 프롬프트 템플릿
# 수면 스토리 생성을 위한 프롬프트 템플릿들

system_prompt: |
  You are a professional sleep story narrator. Your stories are designed to help people fall asleep peacefully.
  Your stories should be:
  - Calm and soothing
  - Descriptive but not overly exciting
  - Gradually slowing down in pace
  - Focused on peaceful, relaxing imagery
  - Free from conflict, tension, or suspense
  - Suitable for all ages

story_templates:
  # 자연 환경 스토리
  nature_walk:
    name: "Nature Walk"
    description: "자연 속을 걷는 평화로운 여행"
    prompt_template: |
      Create a gentle sleep story about a peaceful walk through {location}.
      
      The story should:
      - Begin with the narrator starting a calm walk
      - Describe the peaceful surroundings in detail (sights, sounds, gentle sensations)
      - Include soft, natural sounds like {ambient_sounds}
      - Gradually slow down the pace as the story progresses
      - End with the narrator finding a comfortable place to rest
      - Be approximately {duration_minutes} minutes when read at a slow, calming pace
      - Use simple, soothing language
      - Avoid any elements of danger, excitement, or urgency
      
      Write the story in a way that naturally guides the listener toward sleep.
    
    variables:
      location: ["a quiet forest", "a peaceful meadow", "a serene beach", "a tranquil garden", "a gentle mountain path"]
      ambient_sounds: ["rustling leaves", "gentle breeze", "distant birds", "flowing water", "soft rain"]
      duration_minutes: [15, 20, 25, 30]

  floating_cloud:
    name: "Floating Cloud"
    description: "구름 위에서 떠다니는 꿈같은 여행"
    prompt_template: |
      Write a dreamy sleep story about floating on a soft, fluffy cloud.
      
      The story should:
      - Start with the narrator lying on a comfortable cloud
      - Describe the gentle movement and peaceful sky above
      - Include calming imagery of drifting through the sky
      - Gradually slow the pace, as if the cloud is gently rocking
      - Use repetitive, soothing descriptions
      - Be approximately {duration_minutes} minutes when read slowly
      - Create a sense of weightlessness and peace
      - End with the narrator feeling completely relaxed and ready to sleep
      
      Make it feel like a gentle lullaby in story form.
    
    variables:
      duration_minutes: [15, 20, 25]

  underwater_garden:
    name: "Underwater Garden"
    description: "수중 정원을 탐험하는 평화로운 이야기"
    prompt_template: |
      Create a calming sleep story about exploring a peaceful underwater garden.
      
      The story should:
      - Begin with the narrator gently descending into calm, clear water
      - Describe beautiful underwater plants, gentle fish, and soft light filtering through
      - Include descriptions of slow, graceful movements
      - Use imagery of floating and gentle currents
      - Gradually slow down, as if time itself is slowing
      - Be approximately {duration_minutes} minutes when read at a slow pace
      - Avoid any sense of danger or urgency
      - End with the narrator floating peacefully, ready to drift into sleep
      
      Make it feel like a gentle, meditative journey.
    
    variables:
      duration_minutes: [20, 25, 30]

  # 추상적/명상적 스토리
  breathing_space:
    name: "Breathing Space"
    description: "호흡과 함께하는 명상적 스토리"
    prompt_template: |
      Write a meditative sleep story that guides the listener through a peaceful breathing journey.
      
      The story should:
      - Begin with gentle breathing instructions
      - Describe a peaceful, abstract space (like floating in warm light or soft colors)
      - Use repetitive, rhythmic language that matches slow breathing
      - Gradually become more abstract and dream-like
      - Include gentle affirmations of peace and relaxation
      - Be approximately {duration_minutes} minutes when read very slowly
      - Use simple, soothing words
      - End with the listener feeling completely relaxed and ready for sleep
      
      Make it feel like a guided meditation combined with a gentle story.
    
    variables:
      duration_minutes: [15, 20, 25]

  memory_palace:
    name: "Memory Palace"
    description: "평화로운 기억의 궁전을 탐험하는 이야기"
    prompt_template: |
      Create a gentle sleep story about walking through a peaceful memory palace filled with happy, calm memories.
      
      The story should:
      - Begin with the narrator entering a beautiful, peaceful building
      - Describe rooms filled with warm, happy memories
      - Each room contains a gentle, positive memory
      - Use soft, nostalgic imagery
      - Gradually slow the pace as more rooms are explored
      - Be approximately {duration_minutes} minutes when read slowly
      - Avoid any negative or sad memories
      - End with the narrator finding a comfortable room to rest in
      
      Make it feel like a warm, comforting journey through happy memories.
    
    variables:
      duration_minutes: [20, 25, 30]

  # 계절별 스토리
  winter_cozy:
    name: "Winter Cozy"
    description: "따뜻한 겨울 밤의 아늑한 이야기"
    prompt_template: |
      Write a cozy sleep story set on a peaceful winter evening.
      
      The story should:
      - Begin with the narrator in a warm, comfortable space (by a fireplace, under a blanket, etc.)
      - Describe the gentle sounds of winter (soft wind, distant snow, crackling fire)
      - Include imagery of warmth, comfort, and safety
      - Gradually slow down, as if the world outside is quieting
      - Be approximately {duration_minutes} minutes when read at a slow pace
      - Use warm, comforting language
      - End with the narrator feeling completely cozy and ready to sleep
      
      Make it feel like being wrapped in a warm blanket on a cold night.
    
    variables:
      duration_minutes: [15, 20, 25]

  spring_garden:
    name: "Spring Garden"
    description: "봄 정원에서의 평화로운 시간"
    prompt_template: |
      Create a gentle sleep story about spending time in a peaceful spring garden.
      
      The story should:
      - Begin with the narrator entering a beautiful, blooming garden
      - Describe soft flowers, gentle sunlight, and peaceful nature
      - Include gentle sounds of spring (birds, breeze, water)
      - Use imagery of growth, renewal, and peace
      - Gradually slow down, as if time is standing still
      - Be approximately {duration_minutes} minutes when read slowly
      - Avoid any sense of urgency or activity
      - End with the narrator finding a comfortable spot to rest
      
      Make it feel like a peaceful afternoon in a perfect garden.
    
    variables:
      duration_minutes: [20, 25, 30]

# 스토리 생성 파라미터
generation_params:
  # 기본 설정
  default_duration_minutes: 20
  reading_pace: "slow"  # slow, very_slow, moderate
  tone: "soothing"  # soothing, gentle, calm, peaceful
  target_audience: "all_ages"  # all_ages, adults, children
  
  # 스타일 가이드
  style_guidelines:
    - Use simple, clear language
    - Avoid complex sentences
    - Repeat calming phrases gently
    - Use present tense for immersion
    - Include sensory details (sight, sound, touch)
    - Gradually reduce action and movement
    - End with complete peace and relaxation
  
  # 금지 요소
  avoid:
    - Conflict or tension
    - Sudden loud sounds or surprises
    - Scary or disturbing imagery
    - Complex plots or mysteries
    - Time pressure or urgency
    - Negative emotions
    - Violence or danger

# 메타데이터 생성용
metadata_templates:
  title_template: "{story_name} Sleep Story - {duration} Minutes"
  description_template: |
    Welcome to a peaceful sleep story: "{story_name}".
    
    This {duration}-minute guided sleep story is designed to help you relax and drift off to sleep. 
    The gentle narration and calming imagery will guide you into a state of deep relaxation.
    
    Perfect for:
    - Falling asleep naturally
    - Reducing stress and anxiety
    - Creating a bedtime routine
    - Deep relaxation and meditation
    
    Simply press play, close your eyes, and let the story guide you to peaceful sleep.
    
    Timeline:
    00:00 - Story begins
    {duration}:00 - Story ends, continue sleeping peacefully
    
    #sleepstory #sleep #relaxation #meditation #bedtime #calm #peaceful #sleepaid #guidedmeditation #rest
    
  tags_template:
    - "sleep story"
    - "bedtime story"
    - "sleep"
    - "relaxation"
    - "meditation"
    - "calm"
    - "peaceful"
    - "guided sleep"
    - "sleep aid"
    - "bedtime"
    - "relaxing story"
    - "fall asleep"
    - "deep sleep"
    - "sleep meditation"

