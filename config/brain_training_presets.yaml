defaults:
  answer_display_duration: 5
  bgm_path: null
  enable_narration: false
  enable_subtitles: true
  fps: 30
  intro_duration: 5
  outro_duration: 5
  problem_intro_duration: 3
  video_height: 1080
  video_width: 1920
modules:
  clock_reading:
    answer_template: 정답은 {answer}입니다.
    description: 아날로그 시계를 보고 시간을 맞추는 훈련
    instruction_template: 시계가 가리키는 시간을 맞춰보세요.
    name: 시계 읽기
  korean_word_puzzle:
    answer_template: 정답은 '{answer}'입니다.
    description: 초성이나 힌트를 보고 단어를 맞추는 훈련
    instruction_template: 힌트를 보고 단어를 맞춰보세요.
    name: 한글 퍼즐
  missing_object:
    answer_template: 사라진 물건은 {answer_list}입니다.
    description: 두 그림을 비교하여 사라진 물건을 찾는 훈련
    instruction_template: 두 그림을 비교하여 사라진 물건 {num_missing}개를 찾아보세요.
    name: 사라진 물건 찾기
  number_memory:
    answer_template: 정답은 {answer}입니다.
    description: 화면에 나타나는 숫자를 기억하는 훈련
    instruction_template: 화면에 나오는 {digit_count}자리 숫자를 기억해보세요.
    name: 숫자 기억
  pattern_sequence:
    answer_template: 정답은 {answer}입니다.
    description: 패턴의 규칙을 찾아 다음 순서를 맞추는 훈련
    instruction_template: 패턴의 규칙을 찾아 다음에 올 것을 골라보세요.
    name: 패턴 순서
  word_association:
    answer_template: 정답은 '{answer}'입니다.
    description: 제시된 단어와 관련된 단어를 찾는 훈련
    instruction_template: '''{keyword}''와 관련된 단어를 골라보세요.'
    name: 단어 연상
