defaults:
  answer_display_duration: 15  # 30분 목표: 정답 화면 시간 증가 (5초 → 15초)
  bgm_path: null
  enable_narration: false
  enable_subtitles: true
  fps: 30
  intro_duration: 10  # 30분 목표: 인트로 시간 증가 (5초 → 10초)
  outro_duration: 10  # 30분 목표: 아웃트로 시간 증가 (5초 → 10초)
  problem_intro_duration: 8  # 30분 목표: 문제 소개 시간 증가 (3초 → 8초)
  video_height: 1080
  video_width: 1920
modules:
  clock_reading:
    answer_template: 정답은 {answer}입니다.
    description: 아날로그 시계를 보고 시간을 맞추는 훈련
    instruction_template: 시계가 가리키는 시간을 맞춰보세요.
    name: 시계 읽기
  korean_word_puzzle:
    answer_template: 정답은 '{answer}'입니다.
    description: 초성이나 힌트를 보고 단어를 맞추는 훈련
    instruction_template: 힌트를 보고 단어를 맞춰보세요.
    name: 한글 퍼즐
  # missing_object:  # 비활성화됨 - 틀린그림 찾기는 구현이 어려워 사용하지 않음
  #   answer_template: 사라진 물건은 {answer_list}입니다.
  #   description: 두 그림을 비교하여 사라진 물건을 찾는 훈련
  #   instruction_template: 두 그림을 비교하여 사라진 물건 {num_missing}개를 찾아보세요.
  #   name: 사라진 물건 찾기
  number_memory:
    answer_template: 정답은 {answer}입니다.
    description: 화면에 나타나는 숫자를 기억하는 훈련
    instruction_template: 화면에 나오는 {digit_count}자리 숫자를 기억해보세요.
    name: 숫자 기억
  pattern_sequence:
    answer_template: 정답은 {answer}입니다.
    description: 패턴의 규칙을 찾아 다음 순서를 맞추는 훈련
    instruction_template: 패턴의 규칙을 찾아 다음에 올 것을 골라보세요.
    name: 패턴 순서
  word_association:
    answer_template: 정답은 '{answer}'입니다.
    description: 제시된 단어와 관련된 단어를 찾는 훈련
    instruction_template: '''{keyword}''와 관련된 단어를 골라보세요.'
    name: 단어 연상
  color_memory:
    answer_template: 색상 순서는 {answer_list}입니다.
    description: 화면에 나타나는 색상을 순서대로 기억하는 훈련
    instruction_template: 화면에 나타나는 {num_colors}개의 색상을 순서대로 기억해보세요.
    name: 색상 기억
  simple_calculation:
    answer_template: 정답은 {answer}입니다.
    description: 간단한 덧셈/뺄셈 계산 문제
    instruction_template: 다음 계산을 해보세요.
    name: 간단한 계산
  direction_memory:
    answer_template: 방향 순서는 {answer_list}입니다.
    description: 화면에 나타나는 화살표 방향을 순서대로 기억하는 훈련
    instruction_template: 화면에 나타나는 {num_directions}개의 화살표 방향을 순서대로 기억해보세요.
    name: 방향 기억
  category_classification:
    answer_template: 정답은 '{answer}'입니다.
    description: 여러 항목 중 카테고리에 속하지 않는 것을 찾는 훈련
    instruction_template: 다음 항목 중 {category}이(가) 아닌 것은?
    name: 카테고리 분류
  shape_matching:
    answer_template: 정답은 {answer}번입니다.
    description: 주어진 도형과 같은 도형을 찾는 훈련
    instruction_template: 다음 중 {target_color} {target_shape}와(과) 같은 것은?
    name: 도형 매칭
