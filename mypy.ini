[mypy]
# mypy 설정 파일
# 사용법: mypy scripts/ 또는 mypy src/

# Python 버전
python_version = 3.8

# 타입 체크 모드
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False  # 점진적으로 적용
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True

# 네임스페이스 패키지 허용
namespace_packages = True

# 임포트 관련
ignore_missing_imports = True  # 외부 라이브러리 타입 스텁이 없는 경우 무시
follow_imports = normal

# 경로 설정
mypy_path = .

# 제외할 파일/디렉토리
exclude = (?x)(
    ^(build|dist|\.venv|venv|__pycache__|\.git|\.mypy_cache)/
    | ^(.*/)?node_modules/
    | ^(.*/)?\.pytest_cache/
)

# 특정 모듈 설정
[mypy-numpy]
ignore_missing_imports = True

[mypy-PIL]
ignore_missing_imports = True

[mypy-pydub]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-anthropic]
ignore_missing_imports = True

[mypy-openai]
ignore_missing_imports = True

[mypy-flask]
ignore_missing_imports = True

[mypy-selenium.*]
ignore_missing_imports = True

# scripts/ 디렉토리
[mypy-scripts.*]
check_untyped_defs = True
warn_return_any = True

# src/ 디렉토리
[mypy-src.*]
check_untyped_defs = True
warn_return_any = True

